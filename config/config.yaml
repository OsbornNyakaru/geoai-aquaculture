# =====================================================================
# GeoAI Aquaculture Pond Identification — pipeline configuration.
# Single source of truth. run_pipeline.py reads this; every artifact
# cache is keyed by a hash of the relevant sub-section (see src/utils.py).
# =====================================================================

seed: 42

paths:
  raw_dir: data/raw
  cache_dir: data/cache
  submissions_dir: submissions
  results_tsv: experiments/results.tsv
  train_csv: Train.csv
  test_csv: Test.csv
  sample_submission_csv: SampleSubmission.csv

data:
  sentinel: -9999          # sentinel value for masked bands (-> NaN)
  id_col: ID
  label_col: label
  n_months: 12
  drop_exact_duplicates: true   # 4 dup feature-rows in train (labels consistent)

# ---- Training-time masking augmentation (the core train/test-shift fix) ----
# Each train row (12 months observed) is expanded into K masked "views" whose
# active window matches the empirically-measured test masking recipe.
augment:
  enable: true
  K: 4                     # views per train row for FITTING
  R: 3                     # independent views per held-out row for honest OOF
  window_lengths: [4, 5, 6]        # measured test window lengths
  match_test_distribution: true    # sample L / start from measured test p(L), p(start|L)
  simulate_s2_dropout: true        # mask S2-only in some active months (cloud cover)
  # Measured on Test.csv 2026-07-07 (fraction of active-in-window rows).
  s2_dropout_rates:
    "01": 0.005
    "02": 0.06
    "03": 0.008
    "04": 0.003
    "05": 0.003
    "06": 0.115
    "07": 0.003
    "08": 0.025
    "09": 0.008
    "10": 0.28
    "11": 0.02
    "12": 0.0

# ---- Feature engineering toggles ----
features:
  sar_units: auto          # auto | db | linear  (auto-detect from value range)
  water_indices: true      # NDWI, MNDWI, AWEI_nsh, AWEI_sh, NDVI
  evi: false               # Enhanced Vegetation Index (scaled reflectance); did not help LB
  wif: false               # Water Inundation Frequency; strong on train (AUC .83) but no LB gain
  sar_basic: true          # VH, VV, VV-VH
  sdwi: true               # Sentinel-1 dual-pol water index (S1-only, cloud-robust)
  sar_percentiles: true    # 10/25/50/75/90 pct of VH, VV (permanence discriminator)
  raw_band_aggregates: true
  window_meta: true        # n_active, start/end/center
  asymmetry_flags: true    # S1-present-S2-masked counts + m06/m10 flags
  epsilon: 1.0e-6
  aggregates: [mean, median, min, max, std, range]

cv:
  n_splits: 5
  n_repeats: 3
  shuffle: true

models:
  use: [lightgbm, xgboost, catboost]
  bag_seeds: [42, 7, 13]   # multi-seed bag per model family
  blend: rank              # rank | mean  (rank-average across families)
  scale_pos_weight: 1.0    # mild; calibration is the operating-point lever
  lightgbm:
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 30
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    deterministic: true
    force_row_wise: true
    num_threads: 4
    verbose: -1
  xgboost:
    n_estimators: 600
    learning_rate: 0.03
    max_depth: 5
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    tree_method: hist
    nthread: 4
  catboost:
    iterations: 600
    learning_rate: 0.03
    depth: 6
    l2_leaf_reg: 3.0
    thread_count: 4
    allow_writing_files: false
    verbose: false

calibration:
  method: logit_shift      # logit_shift | isotonic
  t_grid_lo: 0.05
  t_grid_hi: 0.95
  t_grid_step: 0.005
  prior_adjust: true       # base-rate correction for TargetF1 (test is more positive than train)
  estimate_prior: false    # BBSE-estimate the test prior from unlabeled test; overrides assumed_test_prior
  assumed_test_prior: 0.65 # LB-verified peak of the F1-vs-prior curve (0.65->0.8260; falls either side)
  prevalence_target: 0.649 # Iter3: hold seq at the exact realized 0.649 that scored 0.8780, so per_cell_detrend is the only variable. null=off

  prior_sweep: []          # e.g. [0.45,0.50,0.55,0.60] -> one extra submission per prior, no retrain
  prior_sensitivity: [0.40, 0.45, 0.50, 0.55, 0.60]

# ---- Temporal Transformer (rules-safe non-GBDT model; run via --model seq) ----
seq:
  device: auto             # auto | cuda | cpu  (use a GPU Colab runtime)
  d_model: 64
  nhead: 4
  layers: 2
  dropout: 0.2
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 60
  n_splits: 5
  n_repeats: 1             # NN training is costly; 1 repeat by default
  K: 2                     # champion value. Iter4 tested K=4 -> 0.8665 (−0.0115); K=2 is a sharp optimum, reverted
  R: 2                     # masked OOF views per held-out row
  # Iter5 (relative-time reframing, capacity-neutral): left-align each observed window to
  # t_rel=0 so positional embeddings see relative step, not calendar month. WON on LB:
  # 0.8908 vs 0.8780 (+0.0128, clears the ±0.01 noise). Now CHAMPION. false=old champion.
  # See gemini_loop/RESPONSE_04.md (idea A). Held at prevalence_target 0.649.
  relative_time: true
  # pos_encoding: learned=champion (0.8908) | dnorm=duration-normalized | none=NoPE set encoder.
  # Iter7 dnorm RESULT: 0.8844 (−0.0064, did NOT beat champion) -> DISCARDED. Two reasons, both
  # a priori: (1) window LENGTH is already train/test distribution-matched by the masking
  # augmentation, so there was no length covariate-shift to remove — dnorm only normalized away
  # possibly-informative length signal; (2) under relative_time (windows ≤6mo) only table indices
  # 0-5 are trained, but interpolation reads indices up to 11 (untrained). Lesson: positional
  # reframes help ONLY when they delete a channel actually SHIFTED train-vs-test (start=shifted YES;
  # length=matched NO).
  # Iter8 NoPE RESULT: 0.8917 (+0.0009 vs champion = TIE, within noise). Removing ALL positional
  # info costs nothing -> order is nuisance-or-neutral here (confirms SAR set-statistic physics).
  # submission_seq_nope.csv is LOCKED as the DIVERSE private-LB finalist (maximally different model,
  # ties on public -> fails on different rows). Positional lane EXHAUSTED (dnorm −0.006, NoPE +0.001,
  # both < +0.003 -> stop-rule). Champion stays learned; budget shifted to the objective lever.
  pos_encoding: learned
  # Cross-view invariance objective (RESPONSE_05 #4): each row's K=2 masked views get a consistency
  # penalty L = BCE + lambda*mean((logit_v1 - logit_v2)^2), teaching label-invariance to WHICH window
  # is observed. Objective/inductive-bias change (like the winning reframe), NOT an inference add-on.
  # 0.0 = original champion (relative-time only); only active when seq.K>1.
  # Iter9 RESULT (lambda=1.0): 0.8955 — NEW BEST (+0.0047 vs 0.8908; best public score yet). It
  # reduced overconfidence (oof_auc 0.9936->0.9894, prevalence delta 2.03->1.30) — hitting the model's
  # diagnosed weakness. CHAMPION = relative-time + consistency_lambda:1.0.
  # Iter10 RESULT (lambda=3.0): 0.8921 (−0.0034 vs 0.8955) -> REVERTED to 1.0. Reading: lambda=1.0 is
  # an INTERIOR OPTIMUM, not a floor. lambda=3 pushed de-saturation FURTHER (t_star 0.4450->0.3400,
  # prevalence delta 1.30->0.725, raw test pos-rate 0.553->0.583) while oof_auc HELD at 0.9896 — so the
  # loss is NOT ranker collapse; de-saturation simply stops paying past lambda=1. LANE CLOSED: do not
  # sweep lambda again (1.0 vs 3.0 differ by 0.0034, inside the ±0.01 noise — further A/B here is
  # measuring noise, which our own design law forbids).
  consistency_lambda: 1.0
  # Iter6 (MC temporal-dropout TTA, capacity-neutral, INFERENCE-ONLY): predict clean view +
  # n_views views each masking 1-2 random active months, soft-vote. RESPONSE_04 idea C.
  # RESULT: 0.8885 vs 0.8908 champion (-0.0023, within noise but did NOT beat champion) ->
  # DISCARDED (enable:false). Robustness moves keep landing within-noise; gains are in
  # structural reframes, not variance reduction. Code kept for a possible private-LB hedge.
  tta:
    enable: false
    n_views: 8
    mask_months: [1, 2]
  # ---- Transfer-oriented input channels (Step 3). All default OFF => the model
  # sees only standardized bands + missing-indicators (current 2B behaviour).
  # Enable ONE per LB probe; each removes absolute per-series level differently. ----
  channels:
    per_cell_detrend: false  # Iter3 tested ON -> 0.8266 (−0.0514). Adding channels overfits source; reverted. Whole additive-channel family now low-prior.
    deltas: false            # month-to-month differences per band (additive-offset invariant)
    indices: false           # per-month NDWI/MNDWI/NDVI/VV-VH/SDWI (ratios cancel offset)
    rank: false              # within-series rank per band over observed months (monotone-invariant)
    # iter12 candidate. REPLACES the standardized absolute values with their within-series rank,
    # keeping the channel count at 24 -- a capacity-NEUTRAL swap, unlike `rank` above which ADDS.
    # This is the FIRST GENUINE TEST of the amplitude question: per_cell_detrend was believed to
    # have tested it, but it APPENDED its channels (24->36), so it only ever measured "adding 12
    # correlated channels hurts". The amplitude-toxicity law is unevidenced. See RESEARCH_07.md 5c.
    rank_replace: false
    # MUST live under seq.channels (NOT seq.*): to_inputs() only receives cfg["seq"]["channels"].
    # iter12 set `seq.compact_missing` by mistake, so the flag never reached the model and the run
    # came out BIT-IDENTICAL to the champion (n_features 24, identical fold_scores) -- a silent
    # no-op that the screen scored as a legitimate 0.0000 tie. Re-tested in iter13.
    compact_missing: false   # collapse the 12 per-band missing-indicators to [s1_observed,
                             # s2_observed] -> 24 to 14 channels. S2 bands drop out together by
                             # scene, so 10 of 24 channels are near-duplicates; and cloud frequency
                             # is CLIMATOLOGICAL, making the block a wide handle on calendar season
                             # -- the phase-locked axis whose deletion won +0.0128. Capacity-REDUCING.

  # ---- iter12 offline-screen candidates (all default OFF = the exact 0.8955 champion) ----
  # Screened with the estimators that CLEARED the iter11 retro-fit (ATC-F1 rho=+0.964 at 15/15;
  # DIS rho=+1.000 at 5/5). Submit only where >=2 cleared estimators beat the champion.
  pooling: mean            # mean | mean_std | mean_max | mean_min | moments (mean+std+min+max)
  resample_per_epoch: false  # iter21 instance-expansion: fresh masked windows/row each epoch (lam=0 only)
                           #   mean_std: ponds are permanent -> LOW temporal dispersion (Ottinger)
                           #   mean_max: ponds are "never bright"; rice/cropland always have a
                           #             canopy month (VH +6-10 dB). An order statistic carries no
                           #             calendar reference, so it is immune to the temporal shift.
                           # Two round-07 agents DISAGREED on which is right (drain events
                           # contaminate max; canopy events make it discriminative), so both are
                           # implemented and screened rather than chosen blind. See RESEARCH_07.md 5d.
  antithetic_views: false  # draw view 2 maximally distant from view 1 (K=2 only), preserving the
                           # marginal window distribution. Makes the cross-view invariance penalty
                           # (+0.0047, our champion) informative on every row instead of vacuous
                           # where the two windows overlap. Exactly zero capacity change.

run:
  smoke_subsample: 300     # rows used in --smoke
  smoke_trees: 100         # trees per model in --smoke
  smoke_splits: 2
  smoke_K: 1
  smoke_R: 1
